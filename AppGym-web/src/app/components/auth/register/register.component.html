<div class="register-container">
  <div class="register-card">
    <h2>Únete a AppGym</h2>
    <p>Completa tus datos para crear tu cuenta de socio</p>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      
      <div class="form-group">
        <label for="dni">DNI</label>
        <input type="text" id="dni" formControlName="dni" placeholder="Número de documento" />
      </div>

      <div class="form-group">
        <label for="nombreCompleto">Nombre Completo</label>
        <input type="text" id="nombreCompleto" formControlName="nombreCompleto" placeholder="Juan Pérez" />
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" formControlName="email" placeholder="ejemplo@gym.com" />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" formControlName="password" placeholder="Mínimo 6 caracteres" />
      </div>

      <div class="form-group">
        <label for="objetivo">Objetivo Fitness</label>
        <select id="objetivo" formControlName="objetivo">
          <option value="">Selecciona tu objetivo</option>
          <option value="Perder peso">Perder peso</option>
          <option value="Ganar masa muscular">Ganar masa muscular</option>
          <option value="Mantener estado físico">Mantener estado físico</option>
          <option value="Definición">Definición muscular</option>
        </select>
      </div>

      <div class="form-group">
        <label for="sede">Sede</label>
        <select id="sede" formControlName="sede">
          <option value="">Selecciona una sede</option>
          <option value="Sede Central">Sede Central</option>
          <option value="Sede Norte">Sede Norte</option>
          <option value="Sede Sur">Sede Sur</option>
        </select>
      </div>

      <div *ngIf="successMessage" class="alert-success">{{ successMessage }}</div>
      <div *ngIf="errorMessage" class="alert-error">{{ errorMessage }}</div>

      <button type="submit" [disabled]="registerForm.invalid" class="btn-submit">Registrarme</button>
    </form>

    <div class="register-footer">
      <p>¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión aquí</a></p>
    </div>
  </div>
</div>
